<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gift Tracker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a12; color: #f0f0ff; font-family: sans-serif; padding: 16px; }
  .wrap { max-width: 600px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: center; padding: 8px 0 20px; }
  .header h1 { font-size: 22px; background: linear-gradient(135deg, #00f5d4, #ff6bff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .header span { font-size: 12px; color: #00f5d4; background: rgba(0,245,212,0.1); padding: 4px 14px; border-radius: 20px; border: 1px solid #00c4a8; }
  .status { color: #707090; margin-bottom: 10px; font-size: 13px; }
  .gift-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .gift-card { background: #181828; border: 1px solid #2a2a4a; border-radius: 12px; padding: 10px; transition: 0.3s; }
  .gift-card:hover { border-color: #00f5d4; transform: translateY(-3px); }
  .gift-card .image { width: 100%; aspect-ratio: 1/1; background: #20203a; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .gift-card .image img { width: 100%; height: 100%; object-fit: cover; }
  .gift-card .name { font-size: 13px; font-weight: 600; margin-top: 6px; }
  .gift-card .price { font-size: 14px; font-weight: 700; color: #00f5d4; font-family: monospace; }
  .load-more { text-align: center; padding: 20px 0; }
  .load-more button { background: #20203a; border: 1px solid #2a2a4a; color: #b0b0d0; padding: 14px 40px; border-radius: 12px; cursor: pointer; font-size: 16px; }
  .load-more button:hover { border-color: #00f5d4; color: #00f5d4; }
  .load-more .done { color: #707090; }
  .empty { text-align: center; color: #707090; padding: 40px; grid-column: 1 / -1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>🔥 Gift Tracker</h1>
    <span id="status">Загрузка...</span>
  </div>
  <div class="gift-grid" id="grid"></div>
  <div class="load-more" id="more"></div>
</div>

<script>
const TOKEN = "ecee8e6381abac558c2f805a39a2527dc76e9c8a06f8cf87fcc00d43f1811416";
const API = "https://gift-satellite.dev/api";

let allGifts = [], offset = 0, hasMore = true, loading = false;

async function loadGifts(reset = true) {
  if (loading) return;
  loading = true;
  
  if (reset) {
    offset = 0;
    hasMore = true;
    allGifts = [];
    document.getElementById('grid').innerHTML = '';
    document.getElementById('status').textContent = '⏳ Загрузка...';
  }

  try {
    const url = `${API}/search/portals/all-collections?offset=${offset}&limit=30`;
    const response = await fetch(url, {
      headers: { 'Authorization': 'Token ' + TOKEN }
    });
    
    if (!response.ok) throw new Error('Ошибка ' + response.status);
    const data = await response.json();
    
    if (!data || data.length === 0) {
      document.getElementById('grid').innerHTML = '<div class="empty">✦ Подарков не найдено ✦</div>';
      document.getElementById('status').textContent = '❌ Нет данных';
      loading = false;
      return;
    }

    allGifts = reset ? data : allGifts.concat(data);
    offset += data.length;
    hasMore = data.length === 30;
    
    renderGifts();
    
    document.getElementById('status').textContent = allGifts.length + ' подарков';
    
    const moreBtn = document.getElementById('more');
    if (hasMore) {
      moreBtn.innerHTML = `<button onclick="loadGifts(false)">Загрузить ещё</button>`;
    } else {
      moreBtn.innerHTML = `<span class="done">✦ Все подарки загружены ✦</span>`;
    }
    
    loading = false;
  } catch(e) {
    document.getElementById('status').textContent = '❌ ' + e.message;
    loading = false;
  }
}

function renderGifts() {
  const grid = document.getElementById('grid');
  
  grid.innerHTML = allGifts.map(g => {
    // БЕРЁМ КАРТИНКУ ИЗ API
    let imgSrc = null;
    
    // ПРЯМАЯ ССЫЛКА НА КАРТИНКУ
    if (g.imageUrl) {
      imgSrc = g.imageUrl;
    }
    // ИЛИ СОБИРАЕМ ИЗ КОЛЛЕКЦИИ И SLUG
    else if (g.collectionName && g.slug) {
      imgSrc = `https://gift-satellite.dev/api/gift/image/${encodeURIComponent(g.collectionName)}/${encodeURIComponent(g.slug)}.png`;
    }
    
    // ЕСЛИ НЕТ КАРТИНКИ - СТАВИМ ЗАГЛУШКУ
    const imgHtml = imgSrc 
      ? `<img src="${imgSrc}" loading="lazy" onerror="this.parentElement.innerHTML='🔥'">` 
      : '🔥';
    
    const name = g.collectionName || 'Коллекция';
    const price = g.normalizedPrice ? g.normalizedPrice.toFixed(2) + ' TON' : '—';
    
    return `
      <div class="gift-card">
        <div class="image">${imgHtml}</div>
        <div class="name">${name}</div>
        <div class="price">${price}</div>
      </div>
    `;
  }).join('');
}

// ЗАПУСКАЕМ
loadGifts(true);
</script>
</body>
</html>
