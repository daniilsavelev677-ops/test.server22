<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gift Tracker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a12; color: #f0f0ff; font-family: sans-serif; padding: 16px; }
  .wrap { max-width: 600px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: center; padding: 8px 0 20px; }
  .header h1 { font-size: 22px; background: linear-gradient(135deg, #00f5d4, #ff6bff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .gift-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .gift-card { background: #181828; border: 1px solid #2a2a4a; border-radius: 12px; padding: 10px; }
  .gift-card .image { width: 100%; aspect-ratio: 1/1; background: #20203a; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 42px; overflow: hidden; }
  .gift-card .image img { width: 100%; height: 100%; object-fit: cover; }
  .gift-card .name { font-size: 13px; font-weight: 600; margin-top: 6px; }
  .gift-card .price { font-size: 14px; font-weight: 700; color: #00f5d4; }
  .status { color: #707090; margin-bottom: 10px; }
  .load-more { text-align: center; padding: 20px 0; }
  .load-more button { background: #20203a; border: 1px solid #2a2a4a; color: #b0b0d0; padding: 14px 40px; border-radius: 12px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>🔥 Gift Tracker</h1>
  </div>
  <div class="status" id="status">⏳ Загрузка...</div>
  <div class="gift-grid" id="grid"></div>
  <div class="load-more" id="more"></div>
</div>

<script>
  const TOKEN = "ecee8e6381abac558c2f805a39a2527dc76e9c8a06f8cf87fcc00d43f1811416";
  const API = "https://gift-satellite.dev/api";

  let allGifts = [], offset = 0, hasMore = true, loading = false;

  async function apiGet(path) {
    const res = await fetch(API + path, { headers: { 'Authorization': 'Token ' + TOKEN } });
    if (!res.ok) throw new Error('Ошибка ' + res.status);
    return res.json();
  }

  function getImageUrl(g) {
    if (g.imageUrl) return g.imageUrl;
    if (g.collectionName && g.slug) {
      return `https://gift-satellite.dev/api/gift/image/${encodeURIComponent(g.collectionName)}/${encodeURIComponent(g.slug)}.png`;
    }
    return null;
  }

  async function loadGifts(reset = true) {
    if (loading) return;
    loading = true;
    if (reset) { offset = 0; hasMore = true; allGifts = []; document.getElementById('grid').innerHTML = ''; }
    try {
      const data = await apiGet(`/search/portals/all-collections?offset=${offset}&limit=30`);
      if (!data || !data.length) { hasMore = false; loading = false; return; }
      allGifts = reset ? data : allGifts.concat(data);
      offset += data.length;
      hasMore = data.length === 30;
      document.getElementById('grid').innerHTML = allGifts.map(g => {
        const name = g.collectionName || 'Коллекция';
        const price = g.normalizedPrice ? g.normalizedPrice.toFixed(2) + ' TON' : '—';
        const img = getImageUrl(g);
        return `<div class="gift-card"><div class="image">${img ? `<img src="${img}" loading="lazy" onerror="this.parentElement.textContent='🔥'">` : '🔥'}</div><div class="name">${name}</div><div class="price">${price}</div></div>`;
      }).join('');
      document.getElementById('status').textContent = '';
      document.getElementById('more').innerHTML = hasMore ? `<button onclick="loadGifts(false)">Загрузить ещё</button>` : '<span style="color:#707090;">✦ Все ✦</span>';
      loading = false;
    } catch(e) { document.getElementById('status').textContent = '❌ ' + e.message; loading = false; }
  }
  loadGifts(true);
</script>
</body>
</html>
