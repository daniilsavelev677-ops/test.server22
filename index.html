<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gift Tracker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a12; color: #f0f0ff; font-family: -apple-system, sans-serif; padding: 16px; }
  .wrap { max-width: 600px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: center; padding: 8px 0 20px; }
  .header h1 { font-size: 22px; background: linear-gradient(135deg, #00f5d4, #ff6bff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .header span { font-size: 12px; color: #00f5d4; background: rgba(0,245,212,0.1); padding: 4px 14px; border-radius: 20px; border: 1px solid #00c4a8; }
  .status { color: #707090; margin-bottom: 10px; font-size: 13px; }
  .status.err { color: #ff6b6b; }
  .gift-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .gift-card { background: #181828; border: 1px solid #2a2a4a; border-radius: 12px; padding: 10px; transition: 0.3s; }
  .gift-card:hover { border-color: #00f5d4; transform: translateY(-3px); }
  .gift-card .image { width: 100%; aspect-ratio: 1/1; background: #20203a; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 42px; overflow: hidden; }
  .gift-card .image img { width: 100%; height: 100%; object-fit: cover; }
  .gift-card .name { font-size: 13px; font-weight: 600; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gift-card .price { font-size: 14px; font-weight: 700; color: #00f5d4; font-family: monospace; }
  .gift-card .price.na { color: #707090; }
  .load-more { text-align: center; padding: 20px 0; }
  .load-more button { background: #20203a; border: 1px solid #2a2a4a; color: #b0b0d0; padding: 14px 40px; border-radius: 12px; cursor: pointer; font-size: 16px; transition: 0.3s; }
  .load-more button:hover { border-color: #00f5d4; color: #00f5d4; }
  .load-more .done { color: #707090; font-size: 14px; }
  .empty { text-align: center; color: #707090; padding: 40px 10px; grid-column: 1 / -1; }
  .filter-bar { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-btn { flex: 1; min-width: 70px; padding: 8px 6px; border-radius: 10px; border: 1px solid #2a2a4a; background: #181828; color: #b0b0d0; font-size: 10px; text-align: center; cursor: pointer; transition: 0.3s; }
  .filter-btn .label { font-size: 8px; color: #707090; text-transform: uppercase; }
  .filter-btn .value { color: #00f5d4; font-size: 11px; font-weight: 600; }
  .filter-btn:hover { border-color: #00f5d4; }
  .filter-btn.disabled { opacity: 0.4; cursor: not-allowed; }
  .filter-actions { display: flex; gap: 8px; margin-bottom: 14px; }
  .filter-actions button { flex: 1; padding: 10px; border-radius: 10px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; transition: 0.3s; }
  .btn-apply { background: linear-gradient(135deg, #00f5d4, #00c4a8); color: #0a0a12; }
  .btn-apply:hover { transform: scale(0.98); }
  .btn-clear { background: #20203a; color: #b0b0d0; border: 1px solid #2a2a4a; }
  .btn-clear:hover { border-color: #ff6bff; }
  .search-box { width: 100%; padding: 11px 16px; border-radius: 10px; border: 1px solid #2a2a4a; background: #20203a; color: #f0f0ff; font-size: 14px; outline: none; margin-bottom: 14px; }
  .search-box:focus { border-color: #00f5d4; }
  .search-box::placeholder { color: #707090; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(12px); z-index: 200; justify-content: center; align-items: center; padding: 16px; }
  .modal-overlay.active { display: flex; }
  .modal-box { background: #181828; border-radius: 20px; max-width: 400px; width: 100%; max-height: 85vh; padding: 20px 16px 24px; border: 1px solid #00c4a8; overflow-y: auto; }
  .modal-box .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #2a2a4a; }
  .modal-box .head h2 { font-size: 18px; color: #00f5d4; }
  .modal-box .head .close { background: none; border: none; color: #707090; font-size: 24px; cursor: pointer; }
  .modal-box .head .close:hover { color: #ff6bff; }
  .modal-grid { display: flex; flex-direction: column; gap: 8px; }
  .modal-item { background: #20203a; border: 2px solid transparent; border-radius: 12px; padding: 14px 16px; cursor: pointer; transition: 0.3s; display: flex; justify-content: space-between; align-items: center; }
  .modal-item:hover { border-color: #3a3a5a; }
  .modal-item.active { border-color: #00f5d4; background: rgba(0,245,212,0.08); }
  .modal-item .item-name { font-size: 14px; font-weight: 600; }
  .modal-item .item-price { font-size: 14px; font-weight: 700; color: #00f5d4; font-family: monospace; }
  .modal-item .check-mark { color: #00f5d4; font-size: 18px; }
  .modal-search { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid #2a2a4a; background: #20203a; color: #f0f0ff; font-size: 14px; outline: none; margin-bottom: 14px; }
  .modal-search:focus { border-color: #00f5d4; }
  .modal-search::placeholder { color: #707090; }
  .modal-empty { text-align: center; color: #707090; padding: 30px 10px; }
  @media (max-width: 480px) { .gift-grid { gap: 8px; } .gift-card { padding: 8px; } .gift-card .name { font-size: 12px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>🔥 Gift Tracker</h1>
    <span id="headerStatus">Загрузка...</span>
  </div>

  <div class="filter-bar">
    <button class="filter-btn" id="btnCollection">
      <span class="label">Коллекция</span>
      <span class="value" id="selectedCollection">—</span>
    </button>
    <button class="filter-btn disabled" id="btnModel">
      <span class="label">Модель</span>
      <span class="value" id="selectedModel">—</span>
    </button>
    <button class="filter-btn disabled" id="btnBackdrop">
      <span class="label">Фон</span>
      <span class="value" id="selectedBackdrop">—</span>
    </button>
  </div>

  <div class="filter-actions">
    <button class="btn-apply" id="applyFilters">Показать</button>
    <button class="btn-clear" id="clearFilters">Очистить все</button>
  </div>

  <input type="text" class="search-box" id="searchGift" placeholder="🔍 Быстрый поиск">
  <div class="status" id="giftStatus"></div>
  <div class="gift-grid" id="giftGrid"></div>
  <div class="load-more" id="loadMoreContainer"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="head">
      <h2 id="modalTitle">Выберите</h2>
      <button class="close" id="closeModal">✕</button>
    </div>
    <input type="text" class="modal-search" id="modalSearch" placeholder="Поиск...">
    <div class="modal-grid" id="modalGrid"></div>
  </div>
</div>

<script>
const TOKEN = "ecee8e6381abac558c2f805a39a2527dc76e9c8a06f8cf87fcc00d43f1811416";
const API = "https://gift-satellite.dev/api";
const $ = id => document.getElementById(id);

let allGifts = [], offset = 0, hasMore = true, loading = false;
let selCollection = '', selModel = '', selBackdrop = '';
let collectionsList = [], modelsList = [], backdropsList = [];
let modalType = 'collection', modalItems = [];

const EMOJIS = ['🔥','⭐','💎','🌟','✨','🎯','💫','⚡','🌈','🎨','🖼️','🎭','🚀','🏆','👑','🎪'];
const COLLECTION_EMOJIS = ['📁','🗂️','📚','🎨','🖼️','🏛️','🎭','🎪'];

function randEmoji() { return EMOJIS[Math.floor(Math.random() * EMOJIS.length)]; }
function randCollectionEmoji() { return COLLECTION_EMOJIS[Math.floor(Math.random() * COLLECTION_EMOJIS.length)]; }

function headers() { return { 'Authorization': 'Token ' + TOKEN }; }

async function apiGet(path) {
  const res = await fetch(API + path, { headers: headers() });
  if (!res.ok) {
    let msg = 'HTTP ' + res.status;
    try { const j = await res.json(); if (j.message) msg = j.message; } catch(e) {}
    throw new Error(msg);
  }
  return res.json();
}

function setStatus(msg, err) {
  const el = $('giftStatus');
  el.textContent = msg || '';
  el.className = 'status' + (err ? ' err' : '');
}

function setHeaderStatus(msg) { $('headerStatus').textContent = msg || ''; }

async function loadCollections() {
  try {
    const data = await apiGet('/gift/collections');
    collectionsList = data.map(c => c.name).sort();
    setStatus('✅ Коллекции загружены');
    setHeaderStatus(collectionsList.length + ' коллекций');
  } catch(e) {
    setStatus('❌ ' + e.message, true);
    setHeaderStatus('Ошибка');
  }
}

async function loadCollectionDetails(collectionName) {
  try {
    const data = await apiGet(`/gift/collection/${encodeURIComponent(collectionName)}`);
    modelsList = (data.models || []).map(m => m.name).sort();
    backdropsList = (data.backdrops || []).map(b => b.name).sort();
    $('btnModel').classList.remove('disabled');
    $('btnBackdrop').classList.remove('disabled');
    return true;
  } catch(e) {
    modelsList = []; backdropsList = [];
    return false;
  }
}

function getMinPriceForElement(elementName, type) {
  let minPrice = null;
  allGifts.forEach(g => {
    let match = false;
    if (type === 'collection' && g.collectionName === elementName) match = true;
    else if (type === 'model' && g.modelName === elementName) match = true;
    else if (type === 'backdrop' && g.backdropName === elementName) match = true;
    if (match && g.normalizedPrice) {
      if (minPrice === null || g.normalizedPrice < minPrice) minPrice = g.normalizedPrice;
    }
  });
  return minPrice;
}

async function loadGifts(reset = true) {
  if (loading) return;
  if (!hasMore && !reset) return;
  loading = true;

  if (reset) {
    offset = 0; hasMore = true; allGifts = [];
    $('giftGrid').innerHTML = '';
    $('loadMoreContainer').innerHTML = '';
    setStatus('⏳ Загрузка...');
  }

  try {
    const params = new URLSearchParams();
    params.append('offset', offset);
    params.append('limit', 30);
    if (selModel) params.append('models', selModel);
    if (selBackdrop) params.append('backdrops', selBackdrop);
    const coll = selCollection || 'all-collections';
    const data = await apiGet(`/search/portals/${encodeURIComponent(coll)}?${params.toString()}`);

    if (!data || data.length === 0) {
      hasMore = false;
      if (reset) $('giftGrid').innerHTML = '<div class="empty">✦ подарки не найдены ✦</div>';
      setStatus('❌ Подарков не найдено', true);
      loading = false;
      return;
    }

    allGifts = reset ? data : allGifts.concat(data);
    offset += data.length;
    hasMore = data.length === 30;
    renderGifts();

    if (hasMore) {
      $('loadMoreContainer').innerHTML = `<button id="loadMoreBtn">Загрузить ещё</button>`;
      document.getElementById('loadMoreBtn')?.addEventListener('click', () => loadGifts(false));
    } else {
      if (allGifts.length > 0) $('loadMoreContainer').innerHTML = `<span class="done">✦ Все подарки загружены ✦</span>`;
      else $('loadMoreContainer').innerHTML = '';
    }
    setStatus('');
    setHeaderStatus('');
    loading = false;
  } catch(e) {
    setStatus('❌ ' + e.message, true);
    loading = false;
  }
}

function updateDisplay() {
  $('selectedCollection').textContent = selCollection || '—';
  $('selectedModel').textContent = selModel || '—';
  $('selectedBackdrop').textContent = selBackdrop || '—';
}

function openModal(type) {
  if (type !== 'collection' && !selCollection) {
    setStatus('❌ Сначала выберите коллекцию', true);
    return;
  }
  modalType = type;
  const titles = { collection: '✦ Коллекция ✦', model: '✦ Модель ✦', backdrop: '✦ Фон ✦' };
  $('modalTitle').textContent = titles[type] || '✦ Выберите ✦';

  let items = [];
  if (type === 'collection') items = collectionsList.map(name => ({ name, emoji: randCollectionEmoji(), type: 'collection' }));
  else if (type === 'model') items = modelsList.map(name => ({ name, emoji: randEmoji(), type: 'model' }));
  else if (type === 'backdrop') items = backdropsList.map(name => ({ name, emoji: randEmoji(), type: 'backdrop' }));

  modalItems = items;
  renderModalItems(items);
  $('modalSearch').value = '';
  $('modalOverlay').classList.add('active');
}

function getVal(type) {
  if (type === 'collection') return selCollection;
  if (type === 'model') return selModel;
  if (type === 'backdrop') return selBackdrop;
  return '';
}

function setVal(type, val) {
  if (type === 'collection') {
    selCollection = val;
    updateDisplay();
    if (val) {
      loadCollectionDetails(val);
    } else {
      modelsList = []; backdropsList = [];
      $('btnModel').classList.add('disabled');
      $('btnBackdrop').classList.add('disabled');
      selModel = ''; selBackdrop = '';
      updateDisplay();
    }
  } else if (type === 'model') {
    selModel = val;
    updateDisplay();
  } else if (type === 'backdrop') {
    selBackdrop = val;
    updateDisplay();
  }
  closeModal();
  loadGifts(true);
}

function renderModalItems(items) {
  const grid = $('modalGrid');
  const search = $('modalSearch').value.toLowerCase().trim();
  const curr = getVal(modalType);
  let filtered = search ? items.filter(item => item.name.toLowerCase().includes(search)) : items;

  if (!filtered.length) {
    grid.innerHTML = `<div class="modal-empty">✦ ничего не найдено ✦</div>`;
    return;
  }

  grid.innerHTML = filtered.map(item => {
    const isActive = item.name === curr;
    const minPrice = getMinPriceForElement(item.name, item.type);
    const priceText = minPrice !== null ? minPrice.toFixed(2) + ' TON' : '—';
    return `
      <div class="modal-item ${isActive ? 'active' : ''}" data-value="${item.name}">
        <div class="item-left" style="display:flex;align-items:center;gap:12px;">
          <span style="font-size:28px;">${item.emoji || '🎯'}</span>
          <div>
            <div class="item-name">${item.name}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="item-price">${priceText}</span>
          ${isActive ? '<span class="check-mark">✦</span>' : ''}
        </div>
      </div>
    `;
  }).join('');

  grid.querySelectorAll('.modal-item').forEach(el => {
    el.addEventListener('click', function() {
      const value = this.dataset.value;
      const current = getVal(modalType);
      if (current === value) setVal(modalType, '');
      else setVal(modalType, value);
    });
  });
}

function closeModal() { $('modalOverlay').classList.remove('active'); }

// ===== КАРТИНКИ =====
function getImageUrl(g) {
  if (g.imageUrl) return g.imageUrl;
  if (g.collectionName && g.slug) {
    return `https://gift-satellite.dev/api/gift/image/${encodeURIComponent(g.collectionName)}/${encodeURIComponent(g.slug)}.png`;
  }
  return null;
}

// ===== ОТОБРАЖЕНИЕ =====
function renderGifts() {
  const query = $('searchGift').value.toLowerCase().trim();
  let filtered = allGifts.slice();
  if (query) {
    filtered = filtered.filter(g =>
      (g.modelName || '').toLowerCase().includes(query) ||
      (g.slug || '').toLowerCase().includes(query) ||
      (g.collectionName || '').toLowerCase().includes(query) ||
      (g.backdropName || '').toLowerCase().includes(query)
    );
  }
  filtered.sort((a, b) => (a.normalizedPrice || 0) - (b.normalizedPrice || 0));

  const grid = $('giftGrid');
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty">✦ подарки не найдены ✦</div>';
    return;
  }

  grid.innerHTML = filtered.map(g => {
    const name = g.collectionName || 'Коллекция';
    let num = g.number || '';
    if (!num && g.slug) { const m = g.slug.match(/-(\d+)$/); if (m) num = m[1]; }
    const display = num ? `${name} #${num}` : name;
    const price = g.normalizedPrice ? g.normalizedPrice.toFixed(2) + ' TON' : '—';
    const imgUrl = getImageUrl(g);
    let imgHtml = imgUrl ? `<img src="${imgUrl}" alt="${display}" loading="lazy" onerror="this.parentElement.textContent='${randEmoji()}'">` : randEmoji();
    return `
      <div class="gift-card">
        <div class="image">${imgHtml}</div>
        <div class="name">${display}</div>
        <div class="price ${g.normalizedPrice ? '' : 'na'}">${price}</div>
      </div>
    `;
  }).join('');
}

// ===== СОБЫТИЯ =====
$('btnCollection').addEventListener('click', () => openModal('collection'));
$('btnModel').addEventListener('click', () => {
  if (selCollection) openModal('model');
  else setStatus('❌ Сначала выберите коллекцию', true);
});
$('btnBackdrop').addEventListener('click', () => {
  if (selCollection) openModal('backdrop');
  else setStatus('❌ Сначала выберите коллекцию', true);
});
$('closeModal').addEventListener('click', closeModal);
$('modalOverlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
$('modalSearch').addEventListener('input', function() { renderModalItems(modalItems); });
$('applyFilters').addEventListener('click', () => loadGifts(true));
$('clearFilters').addEventListener('click', function() {
  selCollection = ''; selModel = ''; selBackdrop = '';
  modelsList = []; backdropsList = [];
  $('btnModel').classList.add('disabled');
  $('btnBackdrop').classList.add('disabled');
  updateDisplay();
  loadGifts(true);
});
$('searchGift').addEventListener('input', renderGifts);

// ===== ЗАПУСК =====
loadCollections();
setTimeout(() => loadGifts(true), 500);
</script>
</body>
</html>
